name: activeme

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:15 UTC (07:15 WIB).
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Restore schedule cache
        uses: actions/cache/restore@v4
        id: schedule-cache
        with:
          path: .commit_schedule
          key: commit-schedule-${{ github.run_id }}
          restore-keys: |
            commit-schedule-

      - name: Random commit scheduler
        env:
          DEADMAN_MAX_AGE_DAYS: ${{ vars.DEADMAN_MAX_AGE_DAYS || '7' }}
        shell: bash
        run: |
          set -euo pipefail

          MIN_DELAY_DAYS=3
          MAX_DELAY_DAYS=5
          HISTORY_LIMIT=100
          SCHEDULE_FILE=".commit_schedule"
          METADATA_FILE="COMMIT_UPDATE"
          DEADMAN_FILE=".deadman/last_ping.json"
          DEADMAN_MAX_AGE_DAYS="${DEADMAN_MAX_AGE_DAYS:-7}"

          GIT_USER_NAME="abyn365"
          GIT_USER_EMAIL="abyn@abyn.xyz"

          if (( MIN_DELAY_DAYS < 1 )); then
            echo "MIN_DELAY_DAYS must be at least 1."
            exit 1
          fi

          if (( MAX_DELAY_DAYS < MIN_DELAY_DAYS )); then
            echo "MAX_DELAY_DAYS must be >= MIN_DELAY_DAYS."
            exit 1
          fi

          if (( DEADMAN_MAX_AGE_DAYS < 1 )); then
            echo "DEADMAN_MAX_AGE_DAYS must be at least 1."
            exit 1
          fi

          git config --local user.name "$GIT_USER_NAME"
          git config --local user.email "$GIT_USER_EMAIL"

          REPOSITORY="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          BRANCH="${GITHUB_REF_NAME}"

          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          CURRENT_TIME=$(date +%s)

          LAST_COMMIT_SHA=$(git log -1 --format=%H)
          LAST_COMMIT_TIME=$(git log -1 --format=%ct)
          LAST_COMMIT_DATE=$(date -u -d "@$LAST_COMMIT_TIME" '+%Y-%m-%dT%H:%M:%SZ')
          DAYS_SINCE_LAST=$(( (CURRENT_TIME - LAST_COMMIT_TIME) / 86400 ))

          if [[ ! -f "$DEADMAN_FILE" ]]; then
            echo "IS_DUE=false" >> "$GITHUB_ENV"
            echo "### 🛑 Dead-man switch" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status:** No Discord heartbeat has been received." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LAST_PING_AT=$(python3 - "$DEADMAN_FILE" <<'PY'
import json
import sys

with open(sys.argv[1], encoding="utf-8") as state_file:
    value = json.load(state_file).get("last_ping_at", "")

if not isinstance(value, str) or not value:
    raise SystemExit("Dead-man heartbeat has no valid timestamp.")
print(value)
PY
          )
          LAST_PING_TIME=$(date -u -d "$LAST_PING_AT" +%s)
          PING_AGE_SECONDS=$(( CURRENT_TIME - LAST_PING_TIME ))
          MAX_PING_AGE_SECONDS=$(( DEADMAN_MAX_AGE_DAYS * 86400 ))

          if (( PING_AGE_SECONDS < 0 || PING_AGE_SECONDS > MAX_PING_AGE_SECONDS )); then
            echo "IS_DUE=false" >> "$GITHUB_ENV"
            echo "### 🛑 Dead-man switch" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status:** Discord heartbeat is missing or stale." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Last heartbeat:** $LAST_PING_AT" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Maximum age:** $DEADMAN_MAX_AGE_DAYS days" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Dead-man heartbeat accepted: $LAST_PING_AT"

          if [[ -f "$SCHEDULE_FILE" ]]; then
            NEXT_COMMIT_AT=$(cat "$SCHEDULE_FILE")
          else
            DELAY=$((MIN_DELAY_DAYS + RANDOM % (MAX_DELAY_DAYS - MIN_DELAY_DAYS + 1)))
            NEXT_COMMIT_AT=$(date -u -d "+${DELAY} days" '+%Y-%m-%dT%H:%M:%SZ')
            echo "$NEXT_COMMIT_AT" > "$SCHEDULE_FILE"
          fi

          TARGET_TIME=$(date -u -d "$NEXT_COMMIT_AT" +%s)
          REMAINING_SECONDS=$(( TARGET_TIME - CURRENT_TIME ))

          if (( REMAINING_SECONDS > 0 )); then
            DAYS_UNTIL_NEXT=$(( (REMAINING_SECONDS + 86399) / 86400 ))
          else
            DAYS_UNTIL_NEXT=0
          fi

          if (( CURRENT_TIME < TARGET_TIME )); then
            echo "IS_DUE=false" >> $GITHUB_ENV
            echo "### ⏳ Daily Check Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Waiting for target date" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Commit:** $LAST_COMMIT_DATE ($DAYS_SINCE_LAST days ago)" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Date:** $NEXT_COMMIT_AT ($DAYS_UNTIL_NEXT days remaining)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "IS_DUE=true" >> $GITHUB_ENV
          DELAY=$((MIN_DELAY_DAYS + RANDOM % (MAX_DELAY_DAYS - MIN_DELAY_DAYS + 1)))
          NEXT_COMMIT_AT=$(date -u -d "+${DELAY} days" '+%Y-%m-%dT%H:%M:%SZ')
          echo "$NEXT_COMMIT_AT" > "$SCHEDULE_FILE"

          messages=(
            "chore(cloud-sync): automated infrastructure heartbeat"
            "chore(cloud-sync): scheduled cloud environment sync"
            "chore(cloud-sync): background infrastructure validation"
            "chore(cloud-sync): periodic server state reconciliation"
            "chore(cloud-sync): production uptime assurance cycle"
          )
          rand=$((RANDOM % ${#messages[@]}))
          COMMIT_MESSAGE="${messages[$rand]}"

          python3 scripts/update_metadata.py "$METADATA_FILE" "$NOW" "$OWNER" "$REPOSITORY" "$BRANCH" \
            "$LAST_COMMIT_DATE" "$LAST_COMMIT_SHA" "$NEXT_COMMIT_AT" \
            "$DAYS_SINCE_LAST" "$DELAY" "committed" "commit_scheduled" \
            "scheduled_trigger" "$DELAY" "" "$COMMIT_MESSAGE" "$HISTORY_LIMIT"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          COMMIT_SHA=$(git rev-parse HEAD)

          python3 scripts/update_metadata.py "$METADATA_FILE" "$NOW" "$OWNER" "$REPOSITORY" "$BRANCH" \
            "$NOW" "$COMMIT_SHA" "$NEXT_COMMIT_AT" \
            "0" "$DELAY" "committed" "commit_completed" \
            "heartbeat" "$DELAY" "$COMMIT_SHA" "$COMMIT_MESSAGE" "$HISTORY_LIMIT"

          git add "$METADATA_FILE"
          git commit --amend --no-edit

          echo "### ✅ Heartbeat Commit Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`$COMMIT_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** $COMMIT_MESSAGE" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Scheduled Commit:** $NEXT_COMMIT_AT" >> $GITHUB_STEP_SUMMARY

      - name: Save schedule cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .commit_schedule
          key: commit-schedule-${{ github.run_id }}

      - name: Push to GitHub
        if: env.IS_DUE == 'true'
        uses: ad-m/github-push-action@master
        with:
          force: false
          directory: "."
          github_token: ${{ secrets.PAT_TOKEN }}
