name: deadman-ping

on:
  repository_dispatch:
    types: [deadman_ping]

permissions:
  contents: write

concurrency:
  group: deadman-ping
  cancel-in-progress: false

jobs:
  record_ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record heartbeat
        shell: bash
        env:
          DISCORD_USER_ID: ${{ github.event.client_payload.discord_user_id }}
        run: |
          set -euo pipefail
          python3 scripts/record_deadman_ping.py .deadman/last_ping.json "$DISCORD_USER_ID"

      - name: Commit heartbeat
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deadman/last_ping.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deadman): record Discord heartbeat"
          git push